<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GlizzyGobbler SMP</title>
<style>
  /* Layout: minimal single column, hero photo of the Austrian Alps up top, Austrian red/white palette, normal document scroll */
  :root{
    --bg:#fbfaf7;
    --surface:#ffffff;
    --ink:#1b1b1b;
    --ink-soft:#68686a;
    --line:#e6e3dc;
    --red:#ad1f2e;
    --ok:#1aa35a;
    --font-display:'Inter','Helvetica Neue',sans-serif;
    --font-body:'Inter','Helvetica Neue',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131313;
      --surface:#1b1b1b;
      --ink:#f2f1ee;
      --ink-soft:#a3a39d;
      --line:#2d2d2c;
      --red:#e2515f;
      --ok:#3fcf85;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131313;
    --surface:#1b1b1b;
    --ink:#f2f1ee;
    --ink-soft:#a3a39d;
    --line:#2d2d2c;
    --red:#e2515f;
    --ok:#3fcf85;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
  }

  .wrap{
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding-inline:20px;
    padding-block:56px;
    display:flex;
    flex-direction:column;
    gap:32px;
  }

  header{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .flag{
    display:flex;
    flex-direction:column;
    width:30px;
    height:20px;
    border-radius:2px;
    overflow:hidden;
    flex:none;
  }
  .flag span{flex:1;}
  .flag span:nth-child(1){background:var(--red);}
  .flag span:nth-child(2){background:#fff;}
  .flag span:nth-child(3){background:var(--red);}
  h1{
    font-family:var(--font-display);
    font-size:clamp(1.6rem, 6vw, 2.1rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
    text-wrap:balance;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .status .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--ok);
    flex:none;
  }
  @media (prefers-reduced-motion: no-preference){
    .status .dot{animation:pulse 1.8s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  }

  .list{
    display:flex;
    flex-direction:column;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding-block:16px;
    border-top:1px solid var(--line);
    min-width:0;
  }
  .item:last-child{border-bottom:1px solid var(--line);}
  .item-text{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
    flex:1 1 auto;
  }
  .item-label{
    font-size:0.72rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .item-value{
    font-size:1.02rem;
    font-weight:500;
    word-break:break-all;
    user-select:all;
    font-variant-numeric:tabular-nums;
  }
  .item-value .muted{color:var(--ink-soft); font-weight:400;}

  button.copy{
    font-family:var(--font-body);
    font-size:0.82rem;
    font-weight:500;
    background:none;
    color:var(--red);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 12px;
    cursor:pointer;
    flex:none;
  }
  button.copy:hover{border-color:var(--red);}
  button.copy:active{transform:scale(0.96);}
  button.copy:focus-visible, a:focus-visible{outline:2px solid var(--red); outline-offset:2px;}

  .discord{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    color:#fff;
    background:var(--red);
    font-weight:600;
    font-size:0.95rem;
    padding:14px 18px;
    border-radius:10px;
  }
  .discord svg{width:18px;height:18px;flex:none;}

  .note{
    font-size:0.85rem;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0;
  }

  .hosted-by{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.8rem;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .hosted-by .flag{width:20px;height:14px;}

  footer{
    font-size:0.78rem;
    color:var(--ink-soft);
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<div class="wrap">

  <header>
    <span class="flag" aria-hidden="true"><span></span><span></span><span></span></span>
    <h1>GlizzyGobbler SMP</h1>
    <span class="status" id="status"><span class="dot" aria-hidden="true"></span>Online</span>
  </header>

  <div class="list">
    <div class="item">
      <div class="item-text">
        <span class="item-label">Java</span>
        <span class="item-value" id="java-addr">mc.glizzygobblers-smp.fun</span>
      </div>
      <button class="copy" type="button" data-copy-target="java-addr">Kopieren</button>
    </div>

    <div class="item">
      <div class="item-text">
        <span class="item-label">Bedrock</span>
        <span class="item-value" id="bedrock-addr">lauter-tarmec.tun.ply.gg<span class="muted"> : <span id="bedrock-port">39942</span></span></span>
      </div>
      <button class="copy" type="button" data-copy-target="bedrock-addr">Kopieren</button>
    </div>
  </div>

  <p class="note">Java zeigt manchmal „Offline" an &mdash; läuft trotzdem, einfach beitreten.</p>

  <a class="discord" href="https://discord.gg/VCfsdwsAH">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 5.3A17.6 17.6 0 0015.8 4l-.3.6a14.6 14.6 0 00-7 0L8.2 4a17.6 17.6 0 00-4.5 1.3C1 9.9.3 14.3.6 18.7a17.7 17.7 0 005.3 2.6l.9-1.4a11.4 11.4 0 01-1.8-.8l.4-.3a12.6 12.6 0 0012.9 0l.4.3a11.4 11.4 0 01-1.8.8l.9 1.4a17.7 17.7 0 005.3-2.6c.4-5.1-.7-9.5-2.8-13.4zM9.3 15.8c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1zm6.4 0c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.9 2.1-1.9 2.1z"/></svg>
    Discord beitreten
  </a>

  <div class="hosted-by">
    <span class="flag" aria-hidden="true"><span></span><span></span><span></span></span>
    Gehostet von österreichischen Schülern im Poly, lokal in Österreich.
  </div>

  <footer>GlizzyGobbler SMP</footer>
</div>

</body></html>
